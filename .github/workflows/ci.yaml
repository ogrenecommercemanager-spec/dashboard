
name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    env:
      DATABASE_URL: postgres://platform_test:local_test_password@localhost:5432/platform_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: platform_test
          POSTGRES_PASSWORD: local_test_password
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_test -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-targets --locked

  dashboard:
    name: Dashboard and Playwright
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build dashboard
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start full-stack test environment
        working-directory: .
        run: docker compose up -d --build

      - name: Inspect Docker containers
        working-directory: .
        run: |
          docker compose ps -a
          docker compose logs --tail=100 api db dashboard

      - name: Wait for API
        run: |
          curl --fail \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 5 \
            --max-time 10 \
            http://127.0.0.1:8080/healthz

      - name: Wait for dashboard
        run: |
          curl --fail --retry 20 --retry-connrefused \
            --retry-delay 2 \
            http://127.0.0.1:5173/

      - name: Run Playwright tests
        run: npx playwright test

      - name: Collect Docker logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color > docker-ci.log

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-ci-logs
          path: docker-ci.log
          if-no-files-found: ignore

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/dashboard/test-results/
          if-no-files-found: ignore

      - name: Stop test environment
        if: always()
        working-directory: .
        run: docker compose down -v
